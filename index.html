<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mouse Tester</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #app { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
    </style>
</head>
<body>
    <canvas id="app"></canvas>
    <script>
        let canvas, ctx;
        let leftHeld = false, midHeld = false, rightHeld = false;
        let leftStartMs = -1, rightStartMs = -1;
        let x = 0, y, prevx, scrollDirColor = '#444';

        document.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('app');
            ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            
            y = window.innerHeight * 0.5;
            prevx = x;
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());
            requestAnimationFrame(draw);
        });

        function draw() {
            // Trail effect
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
            
            // Smoothed Tracer Line
            ctx.strokeStyle = '#FFF';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(prevx, y); ctx.lineTo(x, y); ctx.stroke();
            prevx = x; x += 4;
            if(x > window.innerWidth) { x = 0; prevx = x; }

            // Diagram Container
            const mx = (window.innerWidth - 200), my = 20;
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath(); ctx.roundRect(mx, my, 160, 150, 10); ctx.fill();
            
            // Left/Right Buttons
            ctx.fillStyle = leftHeld ? '#FFF' : '#444';
            ctx.fillRect(mx + 15, my + 30, 40, 70);
            ctx.fillStyle = rightHeld ? '#FFF' : '#444';
            ctx.fillRect(mx + 105, my + 30, 40, 70);
            
            // Middle Button: Dynamic Scroll Wheel Color
            ctx.fillStyle = scrollDirColor;
            ctx.beginPath(); ctx.roundRect(mx + 60, my + 30, 40, 70, 20); ctx.fill();
            
            // Timers
            ctx.fillStyle = '#8ef79f'; ctx.font = '12px monospace';
            ctx.fillText("L:" + (leftHeld ? (performance.now() - leftStartMs).toFixed(0) + "ms" : "0ms"), mx + 15, my + 180);
            ctx.fillStyle = '#ff8e8e';
            ctx.fillText("R:" + (rightHeld ? (performance.now() - rightStartMs).toFixed(0) + "ms" : "0ms"), mx + 105, my + 180);
            
            requestAnimationFrame(draw);
        }

        window.addEventListener('mousedown', (e) => {
            if (e.button === 0) { leftHeld = true; leftStartMs = performance.now(); }
            if (e.button === 1) midHeld = true;
            if (e.button === 2) { rightHeld = true; rightStartMs = performance.now(); }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 0) leftHeld = false;
            if (e.button === 1) midHeld = false;
            if (e.button === 2) rightHeld = false;
        });

        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            // Scroll Up = Green, Down = Red
            scrollDirColor = e.deltaY < 0 ? '#8ef79f' : '#ff8e8e';
            y = Math.min(Math.max(y + e.deltaY * 0.5, 50), window.innerHeight - 50);
            
            // Fade color back to gray after scroll
            setTimeout(() => { scrollDirColor = '#444'; }, 200);
        }, { passive: false });
    </script>
</body>
</html>
