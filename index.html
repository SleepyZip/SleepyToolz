<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mouse Tester</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; }
        /* Disable touch zoom to keep text sharp */
        #app { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
    </style>
</head>
<body>
    <canvas id="app"></canvas>
    <script>
        let canvas, ctx;
        let leftHeld = false, rightHeld = false;
        let leftHeldMs = 0, rightHeldMs = 0;
        let leftStartMs = -1, rightStartMs = -1;

        document.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('app');
            ctx = canvas.getContext('2d');
            
            // Fix blur: Match canvas internal size to physical screen pixels
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            
            requestAnimationFrame(draw);
        });

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw Mouse Diagram Area
            const mx = (window.innerWidth - 160), my = 20;
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath(); ctx.roundRect(mx, my, 120, 150, 10); ctx.fill();
            
            // Buttons
            ctx.fillStyle = leftHeld ? '#FFF' : '#444';
            ctx.fillRect(mx + 15, my + 30, 40, 70);
            ctx.fillStyle = rightHeld ? '#FFF' : '#444';
            ctx.fillRect(mx + 65, my + 30, 40, 70);
            
            // Data HUD (Below Mouse)
            ctx.font = '14px monospace';
            ctx.fillStyle = '#8ef79f';
            ctx.fillText("L: " + (leftHeld ? (performance.now() - leftStartMs).toFixed(0) + "ms" : "0ms"), mx, my + 170);
            ctx.fillStyle = '#ff8e8e';
            ctx.fillText("R: " + (rightHeld ? (performance.now() - rightStartMs).toFixed(0) + "ms" : "0ms"), mx + 65, my + 170);
            
            requestAnimationFrame(draw);
        }

        window.addEventListener('mousedown', (e) => {
            if (e.button === 0) { leftHeld = true; leftStartMs = performance.now(); }
            if (e.button === 2) { rightHeld = true; rightStartMs = performance.now(); }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 0) leftHeld = false;
            if (e.button === 2) rightHeld = false;
        });

        // Block Right Click Menu
        window.addEventListener('contextmenu', (e) => e.preventDefault());
    </script>
</body>
</html>
